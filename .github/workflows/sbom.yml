name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate project SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM
        uses: ./
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'mikebom-action.sbom.cdx.json'
          artifact-name: 'project-sbom'

