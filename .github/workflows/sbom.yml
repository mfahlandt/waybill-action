name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate project SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: ./
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'waybill-action.sbom.cdx.json'
          artifact-name: 'project-sbom'

