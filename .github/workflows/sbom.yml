name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate project SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate SBOM
        uses: ./
        with:
          path: '.'
          format: 'cyclonedx-json'
          output-file: 'mikebom-action.sbom.cdx.json'
          artifact-name: 'project-sbom'

