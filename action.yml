name: 'waybill SBOM Action'
description: 'Generate Software Bill of Materials (SBOM) using waybill — supports CycloneDX 1.6, SPDX 2.3, and SPDX 3.0.1'
author: 'mfahlandt'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory path to scan for SBOM generation (mutually exclusive with image)'
    required: false
    default: ''
  image:
    description: 'Container image reference or tarball to scan (mutually exclusive with path)'
    required: false
    default: ''
  format:
    description: 'Output format: cyclonedx-json, spdx-2.3-json, spdx-3-json'
    required: false
    default: 'cyclonedx-json'
  output-file:
    description: 'Output file path for the generated SBOM'
    required: false
    default: 'sbom.json'
  upload-artifact:
    description: 'Whether to upload the SBOM as a workflow artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'sbom'
  waybill-version:
    description: 'Version of waybill to use (e.g. v0.2.0). Defaults to latest.'
    required: false
    default: 'v0.2.0'
  include-dev:
    description: 'Include dev/build/test scoped dependencies (when false, runs waybill with --exclude-scope dev,build,test)'
    required: false
    default: 'false'
  offline:
    description: 'Disable all outbound network calls for enrichment'
    required: false
    default: 'false'
  image-src:
    description: 'Image source resolution order: comma-separated list of docker, podman, remote (e.g. docker,remote)'
    required: false
    default: ''

outputs:
  sbom-path:
    description: 'Absolute path to the generated SBOM file'
    value: ${{ steps.run-waybill.outputs.sbom-path }}

runs:
  using: 'composite'
  steps:
    - name: Download and run waybill
      id: run-waybill
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_WAYBILL_VERSION: ${{ inputs.waybill-version }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_IMAGE_SRC: ${{ inputs.image-src }}
      run: ${{ github.action_path }}/scripts/run.sh

    - name: Upload SBOM artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run-waybill.outputs.sbom-path }}
        if-no-files-found: error

